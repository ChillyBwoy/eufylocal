<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eufylocal — Smart Scale C1</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>eufylocal</h1>
    <div id="bluetooth-status" class="badge badge-idle">idle</div>
  </header>

  <main>
    <section class="card current">
      <h2>Current weight</h2>
      <div id="current-weight" class="weight">—</div>
      <div id="last-time" class="muted">no measurement yet</div>
    </section>

    <section class="card info">
      <h2>Bluetooth</h2>
      <dl>
        <dt>Status</dt><dd id="status-value">idle</dd>
        <dt>Device</dt><dd id="device-value">—</dd>
        <dt>Identifier</dt><dd id="device-id">—</dd>
        <dt>Error</dt><dd id="error-value" class="error">—</dd>
      </dl>
    </section>

    <section class="card table">
      <h2>Recent measurements</h2>
      <table>
        <thead>
          <tr>
            <th>Local time</th>
            <th>Weight (kg)</th>
            <th>Impedance (&Omega;)</th>
            <th>Source</th>
            <th>Device</th>
          </tr>
        </thead>
        <tbody id="measurements-body">
          <tr><td colspan="5" class="muted">no measurements yet</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
