[project]
name = "eufylocal"
version = "0.1.0"
description = "Local BLE bridge for the eufy Smart Scale C1 (T9146) - no cloud, no account"
readme = "README.md"
authors = [
    { name = "Cheltcov Evgenii", email = "chill.icp@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bleak>=0.22",
    "fastapi>=0.115",
    "pydantic-settings>=2.10",
    "uvicorn>=0.30",
]

[project.scripts]
eufylocal = "eufylocal.main:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["eufylocal"]
